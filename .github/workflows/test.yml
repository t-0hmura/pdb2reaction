name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
          pip install click pyyaml numpy biopython scipy ase \
            autograd dask distributed h5py fabric jinja2 joblib \
            matplotlib natsort psutil rmsd sympy scikit-learn \
            pandas tabulate plotly pytest pytest-cov

      - name: Run unit tests (CPU-only, no GPU)
        timeout-minutes: 10
        run: |
          pytest tests/ -v --tb=short -x --cov=pdb2reaction --cov-report=term-missing --cov-fail-under=20
