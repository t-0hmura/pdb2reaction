[build-system]
requires = ["setuptools", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pdb2reaction"
description = "pdb2reaction - Automated enzyme reaction path elucidation from PDB structures"
readme = "README.md"
authors = [{name = "Takuto Ohmura", email = "ohmura.takuto@gmail.com"}]
license = {file = "LICENSE"}
dynamic = ["version"]
requires-python = ">=3.11"
keywords = [
    "computational-chemistry",
    "enzyme",
    "reaction-mechanism",
    "transition-state",
    "PDB",
    "machine-learning-potential",
    "MLIP",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    # pdb2reaction core dependencies
    "fairchem-core",
    "pydmf",
    "torch~=2.8.0",
    "numpy>=2.0,<2.5",
    "biopython",
    "ase>=3.26.0",
    "pyyaml",
    "click",
    "plotly>=6.1.1",
    "kaleido",

    # pysisyphus dependencies (bundled)
    "autograd",
    "dask",
    "distributed",
    "h5py",
    "jinja2",
    "natsort",
    "psutil",
    "pyparsing",
    "rmsd",
    "scipy",
    "sympy",
    "scikit-learn",

    # thermoanalysis dependencies (bundled)
    "pandas",
]

[project.optional-dependencies]
orb = ["orb-models"]
aimnet = ["aimnet>=0.2.0"]
# NOTE: MACE is intentionally NOT exposed as a `[mace]` extra — `mace-torch`
# hard-pins `e3nn==0.4.4` while fairchem-core requires `e3nn>=0.5`, so the two
# cannot coexist in one env. Installing MACE here would break the default UMA
# env. Use a dedicated conda env instead: `pip uninstall -y fairchem-core &&
# pip install mace-torch` (e.g. in `pdb2reaction-mace`).
dft = [
    "pyscf>=2.13.0",
    "gpu4pyscf-cuda12x>=1.7.0; platform_machine == 'x86_64'",
    "cupy-cuda12x>=13.0,!=13.4.0; platform_machine == 'x86_64'",
    "basis-set-exchange>=0.11",
]
ci = [
    # Non-GPU deps sufficient for unit tests and docs generation
    # NOTE: torch CPU must be installed separately via --index-url
    "torch",
    "ase",
    "numpy",
    "biopython",
    "scipy",
    "click",
    "pyyaml",
    "autograd",
    "dask",
    "distributed",
    "h5py",
    "jinja2",
    "natsort",
    "psutil",
    "sympy",
    "scikit-learn",
    "pandas",
    "plotly",
    "pytest",
    "pytest-cov",
]
dev = ["pytest", "pytest-cov", "pytest-timeout"]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2024.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autobuild>=2024.0",
]
mcp = [
    "mcp[cli]>=1.0",
]

[project.urls]
Homepage = "https://github.com/t-0hmura/pdb2reaction"
Repository = "https://github.com/t-0hmura/pdb2reaction"
Issues = "https://github.com/t-0hmura/pdb2reaction/issues"
Documentation = "https://t-0hmura.github.io/pdb2reaction/"

[project.scripts]
pdb2reaction = "pdb2reaction.cli:cli"
p2r = "pdb2reaction.cli:cli"
pdb2reaction-mcp = "pdb2reaction.mcp.server:serve"
p2r-mcp = "pdb2reaction.mcp.server:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "gpu: marks tests that require CUDA GPU (deselect with '-m \"not gpu\"')",
    "slow: marks tests that take a long time to run",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pdb2reaction*", "pysisyphus*", "thermoanalysis*"]

[tool.setuptools.package-data]
pdb2reaction = ["py.typed"]

[tool.setuptools_scm]
version_file = "pdb2reaction/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

