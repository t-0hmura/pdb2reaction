[build-system]
requires = ["setuptools", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pdb2reaction"
description = "pdb2reaction - Automated enzyme reaction path modeling from PDB structures"
readme = "README.md"
authors = [{name = "Takuto Ohmura", email = "ohmura.takuto@gmail.com"}]
license = {file = "LICENSE"}
dynamic = ["version"]
requires-python = ">=3.11"
keywords = [
    "computational-chemistry",
    "enzyme",
    "reaction-mechanism",
    "transition-state",
    "PDB",
    "machine-learning-potential",
    "MLIP",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
]
dependencies = [
    # pdb2reaction core dependencies
    "fairchem-core",
    "pydmf",
    "torch>=2.6.0",
    "numpy",
    "biopython",
    "ase>=3.25.0",
    "pyyaml",
    "click",
    "plotly>=6.1.1",
    "kaleido",

    # pysisyphus dependencies (bundled)
    "autograd",
    "dask",
    "distributed",
    "h5py",
    "fabric",
    "jinja2",
    "joblib",
    "matplotlib",
    "natsort",
    "psutil",
    "rmsd",
    "scipy",
    "sympy",
    "scikit-learn",

    # thermoanalysis dependencies (bundled)
    "pandas",
    "tabulate",
]

[project.optional-dependencies]
orb = ["orb-models"]
aimnet = ["aimnet>=0.1.0"]
dft = [    
    "pyscf>=2.8.0",
    "gpu4pyscf-cuda12x>=1.5.2; platform_machine == 'x86_64'",
    "cupy-cuda12x==13.4.1; platform_machine == 'x86_64'",
    "cutensor-cu12==2.2.0; platform_machine == 'x86_64'",
    "basis-set-exchange>=0.11",
]
ci = [
    # Non-GPU deps sufficient for unit tests and docs generation
    # NOTE: torch CPU must be installed separately via --index-url
    "torch",
    "ase",
    "numpy",
    "biopython",
    "scipy",
    "click",
    "pyyaml",
    "autograd",
    "dask",
    "distributed",
    "h5py",
    "fabric",
    "jinja2",
    "joblib",
    "matplotlib",
    "natsort",
    "psutil",
    "rmsd",
    "sympy",
    "scikit-learn",
    "pandas",
    "tabulate",
    "plotly",
    "pytest",
    "pytest-cov",
]
dev = ["pytest", "pytest-cov", "pytest-timeout"]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2024.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autobuild>=2024.0",
]

[project.urls]
Homepage = "https://github.com/t-0hmura/pdb2reaction"
Repository = "https://github.com/t-0hmura/pdb2reaction"
Issues = "https://github.com/t-0hmura/pdb2reaction/issues"
Documentation = "https://t-0hmura.github.io/pdb2reaction/"

[project.scripts]
pdb2reaction = "pdb2reaction.cli:cli"
p2r = "pdb2reaction.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "gpu: marks tests that require CUDA GPU (deselect with '-m \"not gpu\"')",
    "slow: marks tests that take a long time to run",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pdb2reaction*", "pysisyphus*", "thermoanalysis*"]

[tool.setuptools.package-data]
pdb2reaction = ["py.typed"]
pysisyphus = ["wavefunction/ints/*.npy"]

[tool.setuptools_scm]
version_file = "pdb2reaction/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

# -----------------------------------------------------------------------------
# Manuscript-known-good package versions (2026-04, pdb2reaction JCIM submission)
# -----------------------------------------------------------------------------
# The runtime pins above are deliberately left loose so that new users can pick
# up recent bug-fixes in the MLIP backends. The exact versions below are the
# ones that produced the benchmark numbers reported in the pdb2reaction JCIM
# paper. Reproducing the paper results to within numerical noise should only
# require matching these specific versions.
#
#   torch          == 2.8.0+cu129
#   fairchem-core  == 2.19.0      # UMA backend (facebook/UMA)
#   orb-models     == 0.5.5       # ORB backend
#   mace-torch     == (not installed in the benchmark env; MACE results in the
#                     manuscript were obtained with an earlier environment.
#                     The MACE backend is loaded dynamically via the
#                     pdb2reaction.backends.mace plugin; any mace-torch release
#                     that exposes the `MACECalculator` ASE interface should
#                     work. The manuscript used mace-torch 0.3.x.)
#   UMA checkpoint : uma-s-1p1 (HuggingFace `facebook/UMA`, s1.1 variant)
#
# Python: 3.11+ (tested on CPython 3.11 from the `p2r` conda environment).
# CUDA  : 12.9 (driver + toolkit); benchmarks ran on NVIDIA GH200 120 GB.
# -----------------------------------------------------------------------------
